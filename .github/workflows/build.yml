
name: Build TV Home APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4
        with:
          repository: mihirgupta0900/tv-home
          path: source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Lower minimum Android version
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("source/launcher/build-and-install.sh")
          content = path.read_text()

          for old, new in [
              ("--min-sdk-version 30", "--min-sdk-version 26"),
              ("--min-api 30", "--min-api 26"),
          ]:
              if old not in content:
                  raise SystemExit(f"Не найдена настройка: {old}")
              content = content.replace(old, new)

          path.write_text(content)
          print("Минимальная версия Android: API 26")
          PY

      - name: Fix YouTube tile banner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("source/launcher/src/com/mihir/tvhome/MainActivity.java")
          content = path.read_text()

          pattern = r'(?m)^([ \t]*)a\.isBanner = banner != null;\s*\n[ \t]*a\.art = banner != null \? banner : ri\.loadIcon\(pm\);'

          replacement = r'''\1if ("com.google.android.youtube.tv".equals(ai.packageName)
          \1        || "com.google.android.youtube".equals(ai.packageName)) {
          \1    banner = null;
          \1}
          \1a.isBanner = banner != null;
          \1a.art = banner != null ? banner : ri.loadIcon(pm);'''

          content, count = re.subn(
              pattern, replacement, content, count=1
          )

          if count != 1:
              raise SystemExit(
                  "Не удалось найти блок баннера в MainActivity.java"
              )

          path.write_text(content)
          print("YouTube будет использовать обычную иконку.")
          PY

      - name: Build APK
        working-directory: source/launcher
        run: bash build-and-install.sh --build

      - name: Check APK
        run: |
          test -s source/launcher/build/tvhome.apk
          ls -lh source/launcher/build/tvhome.apk

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: tvhome-apk
          path: source/launcher/build/tvhome.apk
          if-no-files-found: error
