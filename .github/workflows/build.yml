
name: Build TV Home APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and verify TV Home
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout launcher source
        uses: actions/checkout@v4
        with:
          repository: mihirgupta0900/tv-home
          path: source

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Patch launcher safely
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("source/launcher")
          java = root / "src/com/mihir/tvhome/MainActivity.java"
          manifest = root / "AndroidManifest.xml"
          script = root / "build-and-install.sh"

          for path in (java, manifest, script):
              if not path.is_file():
                  raise SystemExit(f"ERROR: required file missing: {path}")

          s = java.read_text()

          def once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(
                      f"ERROR: {label}: expected one match, got {count}"
                  )
              s = s.replace(old, new, 1)

          # Track the category used to discover each launchable app.
          once(
              "        String pkg, label;\n"
              "        ComponentName component;",
              "        String pkg, label, launchCategory;\n"
              "        ComponentName component;",
              "App model field"
          )

          # Hide YouTube from this launcher's list only.
          once(
              "        hidden.add(getPackageName());",
              "        hidden.add(getPackageName());\n"
              "        hidden.add(\"com.google.android.youtube.tv\");\n"
              "        hidden.add(\"com.google.android.youtube\");",
              "YouTube exclusion"
          )

          # Discover both Android TV and standard Android launcher apps.
          pattern = re.compile(
              r"        Intent q = new Intent\(Intent\.ACTION_MAIN\)"
              r"\.addCategory\(Intent\.CATEGORY_LEANBACK_LAUNCHER\);"
              r".*?"
              r"        List<App> dock = new ArrayList<>\(\);",
              re.S
          )

          replacement = """        Map<String, App> byPkg = new HashMap<>();

                  Intent tvQuery = new Intent(Intent.ACTION_MAIN)
                          .addCategory(Intent.CATEGORY_LEANBACK_LAUNCHER);
                  for (ResolveInfo ri : pm.queryIntentActivities(tvQuery, 0)) {
                      addLaunchableApp(
                              pm, byPkg, ri, Intent.CATEGORY_LEANBACK_LAUNCHER);
                  }

                  Intent mobileQuery = new Intent(Intent.ACTION_MAIN)
                          .addCategory(Intent.CATEGORY_LAUNCHER);
                  for (ResolveInfo ri : pm.queryIntentActivities(mobileQuery, 0)) {
                      addLaunchableApp(
                              pm, byPkg, ri, Intent.CATEGORY_LAUNCHER);
                  }

                  List<App> dock = new ArrayList<>();"""

          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(
                  "ERROR: could not safely replace the app discovery block"
              )

          # Shared tile creation for either launcher category.
          marker = (
              "    /** A 16:9 card with the app's banner; "
              "the name shows under it while focused. */"
          )

          helper = """    private void addLaunchableApp(
            PackageManager pm, Map<String, App> byPkg,
            ResolveInfo ri, String category) {
        ActivityInfo ai = ri.activityInfo;
        if (ai == null || hidden.contains(ai.packageName)
                || byPkg.containsKey(ai.packageName)) {
            return;
        }

        App a = new App();
        a.pkg = ai.packageName;
        a.label = String.valueOf(ri.loadLabel(pm));
        a.component = new ComponentName(ai.packageName, ai.name);
        a.launchCategory = category;

        Drawable banner = ai.loadBanner(pm);
        if (banner == null) {
            banner = ai.applicationInfo.loadBanner(pm);
        }

        a.isBanner = banner != null;
        a.art = banner != null ? banner : ri.loadIcon(pm);
        a.color = sampleColor(a.pkg, a.art);
        byPkg.put(ai.packageName, a);
    }

"""

          once(marker, helper + marker, "App discovery helper")

          once(
              ".addCategory(Intent.CATEGORY_LEANBACK_LAUNCHER)\n"
              "                .setComponent(app.component)",
              ".addCategory(app.launchCategory)\n"
              "                .setComponent(app.component)",
              "App launch category"
          )

          # Keep the visual effects, but shorten focus animations slightly.
          s = s.replace(
              ".setInterpolator(has ? new OvershootInterpolator(1.8f) "
              ": new DecelerateInterpolator())\n"
              "                .setDuration(has ? 320 : 200).start();",
              ".setInterpolator(new DecelerateInterpolator())\n"
              "                .setDuration(has ? 220 : 160).start();"
          )
          s = s.replace(
              "shine.animate().alpha(has ? 1f : 0f).setDuration(160).start();",
              "shine.animate().alpha(has ? 1f : 0f).setDuration(120).start();"
          )
          s = s.replace(
              ".translationY(has ? dp(4) : 0).setDuration(200).start();",
              ".translationY(has ? dp(4) : 0).setDuration(150).start();"
          )

          java.write_text(s)

          # Make ordinary Android launcher apps visible to package queries.
          xml = manifest.read_text()
          if "</queries>" not in xml:
              raise SystemExit("ERROR: AndroidManifest.xml has no </queries>")

          if 'android.intent.category.LAUNCHER' not in xml:
              xml = xml.replace(
                  "</queries>",
                  """    <intent>
            <action android:name="android.intent.action.MAIN" />
            <category android:name="android.intent.category.LAUNCHER" />
          </intent>
          </queries>""",
                  1
              )
          manifest.write_text(xml)

          # Lower minimum SDK from 30 to 26 for Android 8.0+ devices.
          build_script = script.read_text()
          build_script = build_script.replace(
              "--min-sdk-version 30", "--min-sdk-version 26"
          ).replace("--min-api 30", "--min-api 26")
          script.write_text(build_script)

          print("Launcher source patched successfully.")
          PY

      - name: Build APK
        working-directory: source/launcher
        run: bash build-and-install.sh --build

      - name: Verify APK
        run: |
          set -euo pipefail
          test -s source/launcher/build/tvhome.apk
          ls -lh source/launcher/build/tvhome.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tvhome-apk
          path: source/launcher/build/tvhome.apk
          if-no-files-found: error
          retention-days: 7
