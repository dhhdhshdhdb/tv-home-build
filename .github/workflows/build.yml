
name: Build TV Home APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4
        with:
          repository: mihirgupta0900/tv-home
          path: source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Lower minimum Android version
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("source/launcher/build-and-install.sh")
          content = path.read_text()

          for old, new in [
              ("--min-sdk-version 30", "--min-sdk-version 26"),
              ("--min-api 30", "--min-api 26"),
          ]:
              if old not in content:
                  raise SystemExit(f"Не найдена настройка: {old}")
              content = content.replace(old, new)

          path.write_text(content)
          print("Минимальная версия Android: API 26")
          PY

      - name: Fix YouTube tile and focus overlap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("source/launcher/src/com/mihir/tvhome/MainActivity.java")
          content = path.read_text()

          banner_pattern = (
              r'(?m)^([ \t]*)a\.isBanner = banner != null;\s*\n'
              r'[ \t]*a\.art = banner != null \? banner : ri\.loadIcon\(pm\);'
          )

          banner_replacement = r'''\1if (
          \1        ai.packageName.toLowerCase().contains("youtube")
          \1        || a.label.toLowerCase().contains("youtube")) {
          \1    banner = null;
          \1}
          \1a.isBanner = banner != null;
          \1a.art = banner != null ? banner : ri.loadIcon(pm);'''

          content, banner_count = re.subn(
              banner_pattern, banner_replacement, content, count=1
          )

          if banner_count != 1:
              raise SystemExit("Не найден блок выбора баннера YouTube")

          focus_pattern = (
              r'(?s)        card\.setOnFocusChangeListener\(\(v, has\) -> \{\n'
              r'            float s = has \? \(inDock \? 1\.12f : 1\.1f\) : 1f;.*?'
              r'            shine\.animate\(\)\.alpha\(has \? 1f : 0f\)'
              r'\.setDuration\(160\)\.start\(\);'
          )

          focus_replacement = '''        card.setOnFocusChangeListener((v, has) -> {
              // Stable bounds prevent focus animation from covering nearby tiles.
              v.setScaleX(1f);
              v.setScaleY(1f);
              v.setTranslationZ(0f);
              shine.animate().alpha(has ? 1f : 0f).setDuration(160).start();'''

          content, focus_count = re.subn(
              focus_pattern, focus_replacement, content, count=1
          )

          if focus_count != 1:
              raise SystemExit("Не найден обработчик масштаба плитки")

          path.write_text(content)
          print("YouTube banner disabled; focus overlap fix applied.")
          PY

      - name: Build APK
        working-directory: source/launcher
        run: bash build-and-install.sh --build

      - name: Check APK
        run: |
          test -s source/launcher/build/tvhome.apk
          ls -lh source/launcher/build/tvhome.apk

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: tvhome-apk
          path: source/launcher/build/tvhome.apk
          if-no-files-found: error
