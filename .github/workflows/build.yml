
name: Build TV Home APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4
        with:
          repository: mihirgupta0900/tv-home
          path: source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Lower minimum Android version
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("source/launcher/build-and-install.sh")
          content = path.read_text()

          for old, new in [
              ("--min-sdk-version 30", "--min-sdk-version 26"),
              ("--min-api 30", "--min-api 26"),
          ]:
              if old in content:
                  content = content.replace(old, new)

          path.write_text(content)
          print("Minimum Android version set to API 26 where applicable.")
          PY

      - name: Remove YouTube tile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "source/launcher/src/com/mihir/tvhome/MainActivity.java"
          )
          content = path.read_text(encoding="utf-8")

          class_marker = "public class MainActivity extends Activity {"
          constant = (
              class_marker
              + '\n    private static final String HIDDEN_APP_KEYWORD = "youtube";'
          )

          if "private static final String HIDDEN_APP_KEYWORD" not in content:
              if content.count(class_marker) != 1:
                  raise SystemExit(
                      "ERROR: could not uniquely locate MainActivity class."
                  )
              content = content.replace(class_marker, constant, 1)

          pattern = re.compile(
              r"(?m)^([ \t]*)ActivityInfo ai = ri\.activityInfo;"
          )

          if "packageName.contains(HIDDEN_APP_KEYWORD)" not in content:
              replacement = (
                  r"\1ActivityInfo ai = ri.activityInfo;\n"
                  r"\1String packageName = ai.packageName == null "
                  r'? "" : ai.packageName.toLowerCase(Locale.ROOT);\n'
                  r"\1if (packageName.contains(HIDDEN_APP_KEYWORD)) {\n"
                  r"\1    continue;\n"
                  r"\1}"
              )
              content, count = pattern.subn(replacement, content, count=1)

              if count != 1:
                  raise SystemExit(
                      "ERROR: could not locate app enumeration block; "
                      "source was not patched."
                  )

          path.write_text(content, encoding="utf-8")
          print("YouTube package filter applied.")
          PY

      - name: Build APK
        working-directory: source/launcher
        run: bash build-and-install.sh --build

      - name: Check APK
        run: |
          test -s source/launcher/build/tvhome.apk
          ls -lh source/launcher/build/tvhome.apk

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: tvhome-apk
          path: source/launcher/build/tvhome.apk
          if-no-files-found: error
          retention-days: 7
