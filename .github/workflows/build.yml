name: Build TV Home APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4
        with:
          repository: mihirgupta0900/tv-home
          path: source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Lower minimum Android version
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("source/launcher/build-and-install.sh")
          content = path.read_text()

          for old, new in [
              ("--min-sdk-version 30", "--min-sdk-version 26"),
              ("--min-api 30", "--min-api 26"),
          ]:
              if old not in content:
                  raise SystemExit(f"Не найдена настройка: {old}")
              content = content.replace(old, new)

          path.write_text(content)
          print("Минимальная версия Android: API 26")
          PY

      - name: Patch launcher source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          java = Path("source/launcher/src/com/mihir/tvhome/MainActivity.java")
          content = java.read_text()

          def replace_once(pattern, replacement, label, flags=0):
              global content
              updated, count = re.subn(
                  pattern, replacement, content, count=1, flags=flags
              )
              if count != 1:
                  raise SystemExit(
                      f"{label}: ожидалось одно совпадение, найдено {count}. "
                      "Сборка остановлена; исходник не будет собран."
                  )
              content = updated

          # 1. Store the category used to launch each app.
          replace_once(
              r'(?m)^([ \t]*)String pkg, label;\s*$',
              r'\1String pkg, label, launchCategory;',
              "Поле категории запуска"
          )

          # 2. Hide YouTube from both the dock and the app grid.
          replace_once(
              r'(?m)^([ \t]*)hidden\.add\(getPackageName\(\)\);$',
              r'\1hidden.add(getPackageName());\n'
              r'\1hidden.add("com.google.android.youtube.tv");\n'
              r'\1hidden.add("com.google.android.youtube");',
              "Скрытие YouTube"
          )

          # 3. Discover Android TV apps first, then ordinary Android launcher apps.
          catalog_pattern = (
              r'(?ms)^        Intent q = new Intent\(Intent\.ACTION_MAIN\)'
              r'\.addCategory\(Intent\.CATEGORY_LEANBACK_LAUNCHER\);\n'
              r'        Map<String, App> byPkg = new HashMap<>\(\);\n'
              r'        for \(ResolveInfo ri : pm\.queryIntentActivities\(q, 0\)\) \{\n'
              r'.*?'
              r'        \}\n(?=\n        List<App> dock = new ArrayList<>\(\);)'
          )

          catalog_replacement = '''        Map<String, App> byPkg = new HashMap<>();

                  Intent tvQuery = new Intent(Intent.ACTION_MAIN)
                          .addCategory(Intent.CATEGORY_LEANBACK_LAUNCHER);
                  for (ResolveInfo ri : pm.queryIntentActivities(tvQuery, 0)) {
                      addLaunchableApp(
                              pm, byPkg, ri, Intent.CATEGORY_LEANBACK_LAUNCHER);
                  }

                  Intent mobileQuery = new Intent(Intent.ACTION_MAIN)
                          .addCategory(Intent.CATEGORY_LAUNCHER);
                  for (ResolveInfo ri : pm.queryIntentActivities(mobileQuery, 0)) {
                      addLaunchableApp(
                              pm, byPkg, ri, Intent.CATEGORY_LAUNCHER);
                  }
          '''

          replace_once(
              catalog_pattern,
              lambda match: catalog_replacement,
              "Замена каталога приложений"
          , flags=0)

          # 4. Centralize app creation and prevent YouTube banners from being used.
          helper_marker = (
              "    /** A 16:9 card with the app's banner; "
              "the name shows under it while focused. */"
          )

          helper = '''    private void addLaunchableApp(
            PackageManager pm, Map<String, App> byPkg,
            ResolveInfo ri, String category) {
        ActivityInfo ai = ri.activityInfo;
        if (ai == null || hidden.contains(ai.packageName)
                || byPkg.containsKey(ai.packageName)) {
            return;
        }

        App a = new App();
        a.pkg = ai.packageName;
        a.label = String.valueOf(ri.loadLabel(pm));
        a.component = new ComponentName(ai.packageName, ai.name);
        a.launchCategory = category;

        Drawable banner = ai.loadBanner(pm);
        if (banner == null) {
            banner = ai.applicationInfo.loadBanner(pm);
        }

        a.isBanner = banner != null;
        a.art = banner != null ? banner : ri.loadIcon(pm);
        a.color = sampleColor(a.pkg, a.art);
        byPkg.put(a.pkg, a);
    }

'''

          if content.count(helper_marker) != 1:
              raise SystemExit(
                  "Метод добавления приложений: не найдено "
                  "единственное место вставки."
              )
          content = content.replace(helper_marker, helper + helper_marker, 1)

          # 5. Launch each tile using the category that discovered it.
          click_pattern = (
              r'(?s)(card\.setOnClickListener\(v -> launch\(new Intent\(Intent\.ACTION_MAIN\)\s*)'
              r'\.addCategory\(Intent\.CATEGORY_LEANBACK_LAUNCHER\)'
          )
          replace_once(
              click_pattern,
              r'\1.addCategory(app.launchCategory)',
              "Запуск приложений разных типов"
          )

          # 6. Reduce focus animation duration without removing the visual effects.
          replace_once(
              r'\.setInterpolator\(has \? new OvershootInterpolator\(1\.8f\) : new DecelerateInterpolator\(\)\)\s*'
              r'\.setDuration\(has \? 320 : 200\)\.start\(\);',
              '.setInterpolator(new DecelerateInterpolator())\n'
              '                    .setDuration(has ? 220 : 160).start();',
              "Анимация фокуса"
          )

          replace_once(
              r'shine\.animate\(\)\.alpha\(has \? 1f : 0f\)'
              r'\.setDuration\(160\)\.start\(\);',
              'shine.animate().alpha(has ? 1f : 0f).setDuration(120).start();',
              "Анимация подсветки"
          )

          replace_once(
              r'label\.animate\(\)\.alpha\(has \? 1f : 0f\)'
              r'\.translationY\(has \? dp\(4\) : 0\)\.setDuration\(200\)\.start\(\);',
              'label.animate().alpha(has ? 1f : 0f)'
              '.translationY(has ? dp(4) : 0).setDuration(150).start();',
              "Анимация подписи"
          )

          java.write_text(content)
          print("Java-патчи применены.")

          # 7. Allow queries for both Android TV and ordinary Android launchers.
          manifest = Path("source/launcher/AndroidManifest.xml")
          xml = manifest.read_text()

          leanback = '''        <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                  </intent>'''

          launcher = leanback + '''
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>'''

          if xml.count(leanback) != 1:
              raise SystemExit(
                  "Manifest: не найден уникальный LEANBACK intent."
              )

          xml = xml.replace(leanback, launcher, 1)
          manifest.write_text(xml)
          print("Manifest обновлён.")

          # 8. Sanity checks before compiling.
          assert 'String pkg, label, launchCategory;' in content
          assert 'addCategory(app.launchCategory)' in content
          assert 'com.google.android.youtube.tv' in content
          assert 'CATEGORY_LAUNCHER' in content
          assert xml.count('android.intent.category.LAUNCHER') == 1

          print("Проверки патчей пройдены.")
          PY

      - name: Build APK
        working-directory: source/launcher
        run: bash build-and-install.sh --build

      - name: Check APK
        run: |
          test -s source/launcher/build/tvhome.apk
          ls -lh source/launcher/build/tvhome.apk

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: tvhome-apk
          path: source/launcher/build/tvhome.apk
          if-no-files-found: error