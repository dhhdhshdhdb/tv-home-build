
name: Build TV Home APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Patch and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4
        with:
          path: build-repo

      - name: Checkout pinned upstream source
        uses: actions/checkout@v4
        with:
          repository: mihirgupta0900/tv-home
          ref: 19803542cd335e0b2643dfa73c18c38051354ffa
          path: source
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Inspect build script
        working-directory: source/launcher
        shell: bash
        run: |
          set -euo pipefail
          test -f build-and-install.sh
          echo "=== Build script ==="
          sed -n '1,180p' build-and-install.sh
          echo "=== Relevant commands ==="
          grep -nE 'adb|git checkout|git reset|git clean|tv\.py|aapt2|javac|d8|zipalign|apksigner|--build' \
            build-and-install.sh || true
          echo "=== Required build-only exit ==="
          grep -F '[ "${1:-}" = "--build" ] && exit 0' \
            build-and-install.sh
          echo "Build-only guard verified."

      - name: Patch minimum Android API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("source/launcher/build-and-install.sh")
          text = path.read_text(encoding="utf-8")

          replacements = {
              "--min-sdk-version 30": "--min-sdk-version 26",
              "--min-api 30": "--min-api 26",
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one occurrence of {old!r}; found {count}."
                  )
              text = text.replace(old, new, 1)

          if "--min-sdk-version 26" not in text:
              raise SystemExit("Minimum SDK patch verification failed.")
          if "--min-api 26" not in text:
              raise SystemExit("DEX minimum API patch verification failed.")

          path.write_text(text, encoding="utf-8")
          print("Verified: min SDK = 26; DEX min API = 26.")
          PY

      - name: Hide YouTube via native config
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("source/launcher/res/values/config.xml")
          text = path.read_text(encoding="utf-8")

          pattern = re.compile(
              r'(<string-array name="hidden_apps">)(.*?)(</string-array>)',
              re.S,
          )
          match = pattern.search(text)
          if not match:
              raise SystemExit("ERROR: hidden_apps array not found")

          body = match.group(2)
          package = "com.google.android.youtube.tv"

          if not re.search(
              r"<item>\s*" + re.escape(package) + r"\s*</item>",
              body,
          ):
              body += f"\n        <item>{package}</item>\n    "

          text = text[:match.start(2)] + body + text[match.end(2):]
          path.write_text(text, encoding="utf-8")

          check = path.read_text(encoding="utf-8")
          hidden = re.search(
              r'<string-array name="hidden_apps">(.*?)</string-array>',
              check,
              re.S,
          )
          if not hidden or f"<item>{package}</item>" not in hidden.group(1):
              raise SystemExit("ERROR: YouTube was not added to hidden_apps")

          print("OK: YouTube added to hidden_apps")
          print(hidden.group(0))
          PY

      - name: Verify patched source
        shell: bash
        run: |
          set -euo pipefail
          grep -n -A 10 'name="hidden_apps"' \
            source/launcher/res/values/config.xml

          if grep -q 'HIDDEN_APP_KEYWORD' \
            source/launcher/src/com/mihir/tvhome/MainActivity.java; then
            echo "ERROR: old Java filter is still present"
            exit 1
          fi

          grep -nE -- '--min-sdk-version 26|--min-api 26' \
            source/launcher/build-and-install.sh

          echo "OK: native config verified"

      - name: Build APK
        working-directory: source/launcher
        shell: bash
        run: |
          set -euo pipefail
          bash build-and-install.sh --build

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="source/launcher/build/tvhome.apk"

          test -s "$APK"
          file "$APK"
          sha256sum "$APK" | tee source/launcher/build/SHA256SUMS.txt
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tvhome-apk
          path: |
            source/launcher/build/tvhome.apk
            source/launcher/build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
