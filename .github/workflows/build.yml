
name: Build TV Home APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4
        with:
          repository: mihirgupta0900/tv-home
          path: source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Lower minimum Android version
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("source/launcher/build-and-install.sh")
          content = path.read_text()

          for old, new in [
              ("--min-sdk-version 30", "--min-sdk-version 26"),
              ("--min-api 30", "--min-api 26"),
          ]:
              if old in content:
                  content = content.replace(old, new)

          path.write_text(content)
          print("Проверена минимальная версия Android.")
          PY

      - name: Patch launcher source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          java_path = Path(
              "source/launcher/src/com/mihir/tvhome/MainActivity.java"
          )
          content = java_path.read_text()

          def replace_once(old, new, label):
              global content
              count = content.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{label}: ожидалось 1 совпадение, найдено {count}. "
                      "Сборка остановлена."
                  )
              content = content.replace(old, new, 1)

          # 1. Запоминаем категорию, через которую найдено приложение.
          replace_once(
              "        String pkg, label;\n        ComponentName component;",
              "        String pkg, label, launchCategory;\n"
              "        ComponentName component;",
              "Поле категории запуска"
          )

          # 2. Скрываем YouTube, не удаляя само приложение с телевизора.
          replace_once(
              "        hidden.add(getPackageName());",
              "        hidden.add(getPackageName());\n"
              "        hidden.add(\"com.google.android.youtube.tv\");\n"
              "        hidden.add(\"com.google.android.youtube\");",
              "Скрытие YouTube"
          )

          # 3. Заменяем каталог: сначала Android TV, затем обычные приложения.
          start = content.find(
              "        Intent q = new Intent(Intent.ACTION_MAIN)"
              ".addCategory(Intent.CATEGORY_LEANBACK_LAUNCHER);"
          )
          end_marker = "        List<App> dock = new ArrayList<>();"
          end = content.find(end_marker, start)

          if start < 0 or end < 0:
              raise SystemExit(
                  "Не найден блок каталога приложений. Сборка остановлена."
              )

          old_block = content[start:end]
          if "byPkg.put(ai.packageName, a);" not in old_block:
              raise SystemExit(
                  "Блок каталога отличается от ожидаемого. "
                  "Сборка остановлена."
              )

          new_block = '''        Map<String, App> byPkg = new HashMap<>();

                  Intent tvQuery = new Intent(Intent.ACTION_MAIN)
                          .addCategory(Intent.CATEGORY_LEANBACK_LAUNCHER);
                  for (ResolveInfo ri : pm.queryIntentActivities(tvQuery, 0)) {
                      addLaunchableApp(
                              pm, byPkg, ri, Intent.CATEGORY_LEANBACK_LAUNCHER);
                  }

                  Intent mobileQuery = new Intent(Intent.ACTION_MAIN)
                          .addCategory(Intent.CATEGORY_LAUNCHER);
                  for (ResolveInfo ri : pm.queryIntentActivities(mobileQuery, 0)) {
                      addLaunchableApp(
                              pm, byPkg, ri, Intent.CATEGORY_LAUNCHER);
                  }

          '''
          content = content[:start] + new_block + content[end:]

          # 4. Общий метод создания плитки приложения.
          marker = (
              "    /** A 16:9 card with the app's banner; "
              "the name shows under it while focused. */"
          )

          helper = '''    private void addLaunchableApp(
            PackageManager pm, Map<String, App> byPkg,
            ResolveInfo ri, String category) {
        ActivityInfo ai = ri.activityInfo;
        if (ai == null || hidden.contains(ai.packageName)
                || byPkg.containsKey(ai.packageName)) {
            return;
        }

        App a = new App();
        a.pkg = ai.packageName;
        a.label = String.valueOf(ri.loadLabel(pm));
        a.component = new ComponentName(ai.packageName, ai.name);
        a.launchCategory = category;

        Drawable banner = ai.loadBanner(pm);
        if (banner == null) {
            banner = ai.applicationInfo.loadBanner(pm);
        }

        a.isBanner = banner != null;
        a.art = banner != null ? banner : ri.loadIcon(pm);
        a.color = sampleColor(a.pkg, a.art);
        byPkg.put(ai.packageName, a);
    }

'''
          replace_once(marker, helper + marker, "Метод добавления приложений")

          # 5. Запускаем плитку с правильной категорией.
          replace_once(
              ".addCategory(Intent.CATEGORY_LEANBACK_LAUNCHER)\n"
              "                .setComponent(app.component)",
              ".addCategory(app.launchCategory)\n"
              "                .setComponent(app.component)",
              "Запуск приложений"
          )

          # 6. Умеренно ускоряем анимации фокуса.
          replace_once(
              ".setInterpolator(has ? new OvershootInterpolator(1.8f) "
              ": new DecelerateInterpolator())\n"
              "                .setDuration(has ? 320 : 200).start();",
              ".setInterpolator(new DecelerateInterpolator())\n"
              "                .setDuration(has ? 220 : 160).start();",
              "Анимация плиток"
          )

          replace_once(
              "shine.animate().alpha(has ? 1f : 0f).setDuration(160).start();",
              "shine.animate().alpha(has ? 1f : 0f).setDuration(120).start();",
              "Анимация подсветки"
          )

          replace_once(
              "label.animate().alpha(has ? 1f : 0f)"
              ".translationY(has ? dp(4) : 0).setDuration(200).start();",
              "label.animate().alpha(has ? 1f : 0f)"
              ".translationY(has ? dp(4) : 0).setDuration(150).start();",
              "Анимация подписи"
          )

          java_path.write_text(content)
          print("Java-патчи применены.")

          # 7. Разрешаем системе видеть оба типа запускаемых приложений.
          manifest_path = Path("source/launcher/AndroidManifest.xml")
          xml = manifest_path.read_text()

          queries_end = xml.find("</queries>")
          if queries_end < 0:
              raise SystemExit("Manifest: не найден </queries>.")

          launcher_category = (
              'android:name="android.intent.category.LAUNCHER"'
          )

          if launcher_category not in xml:
              launcher_intent = '''        <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
        '''
              xml = (
                  xml[:queries_end]
                  + launcher_intent
                  + xml[queries_end:]
              )

          manifest_path.write_text(xml)
          print("Manifest обновлён.")
          print("Проверки текстовых патчей завершены.")
          PY

      - name: Build APK
        working-directory: source/launcher
        run: bash build-and-install.sh --build

      - name: Check APK
        run: |
          test -s source/launcher/build/tvhome.apk
          ls -lh source/launcher/build/tvhome.apk

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: tvhome-apk
          path: source/launcher/build/tvhome.apk
          if-no-files-found: error
